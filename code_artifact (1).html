<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧颱風防汛與避難動態導航系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS 地圖套件 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        .leaflet-container {
            z-index: 10;
        }
        /* 自訂動態路線脈衝效果 */
        @keyframes dash {
            to {
                stroke-dashoffset: -40;
            }
        }
        .route-path-animated {
            stroke-dasharray: 8, 8;
            animation: dash 1.5s linear infinite;
        }
        /* 自訂風速地圖標誌脈衝與飄動動畫 */
        @keyframes windPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .wind-marker-animated {
            animation: windPulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-cloud-showers-heavy text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">智慧颱風防汛與動態避難系統</h1>
                    <p class="text-xs text-slate-400">目前定位：宜蘭縣中華國中 (24.7492, 121.7675)</p>
                </div>
            </div>

            <!-- 模式切換鈕 -->
            <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
                <button id="btnRealtimeMode" onclick="switchMode('realtime')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 bg-blue-600 text-white shadow">
                    <i class="fa-solid fa-bolt"></i>
                    <span>現實即時資訊模式</span>
                </button>
                <button id="btnCiampiMode" onclick="switchMode('ciampi')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-history"></i>
                    <span>薔琵颱風模擬模式</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- 風速監測儀表板 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <!-- 模式標籤與說明 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                <div>
                    <span id="currentModeBadge" class="inline-block px-2.5 py-1 rounded-full text-xs font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30 mb-2">
                        <i class="fa-solid fa-circle-dot text-[10px] mr-1"></i> 現實即時模式
                    </span>
                    <h2 id="currentModeTitle" class="text-base font-bold text-white">即時氣象與防汛監測</h2>
                    <p id="currentModeDesc" class="text-xs text-slate-400 mt-1">即時檢索全台灣與宜蘭地區當前風雨警報與災情。</p>
                </div>
                <button onclick="findNearestShelter()" class="mt-3 w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-person-running text-sm"></i>
                    <span>📍 找出最近避難所 (黎明國小)</span>
                </button>
            </div>

            <!-- 平均風速 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center space-x-4">
                <div class="p-3 bg-cyan-500/10 text-cyan-400 rounded-xl">
                    <i class="fa-solid fa-wind text-2xl"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-medium">平均風速</div>
                    <div class="text-2xl font-black text-white mt-0.5"><span id="windSpeed">3.2</span> <span class="text-xs font-normal text-slate-400">m/s</span></div>
                    <div class="text-xs text-cyan-400 mt-0.5" id="windSpeedKm">約 11.5 km/h</div>
                </div>
            </div>

            <!-- 最大陣風 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center space-x-4">
                <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl">
                    <i class="fa-solid fa-tornado text-2xl"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-medium">最大陣風</div>
                    <div class="text-2xl font-black text-white mt-0.5"><span id="gustSpeed">5.5</span> <span class="text-xs font-normal text-slate-400">m/s</span></div>
                    <div class="text-xs text-amber-400 mt-0.5 font-bold" id="gustLevel">3 級陣風 (微風)</div>
                </div>
            </div>

            <!-- 風級警戒狀態 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center space-x-4">
                <div class="p-3 bg-rose-500/10 text-rose-400 rounded-xl" id="warningIconBox">
                    <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-medium">蒲福風級防護提示</div>
                    <div class="text-sm font-bold text-rose-400 mt-0.5" id="warningTitle">風勢平穩警戒解除</div>
                    <div class="text-xs text-slate-400 mt-0.5 leading-tight" id="warningDesc">微風狀態，請隨時留意最新氣象發佈與降雨預報。</div>
                </div>
            </div>
        </div>

        <!-- 搜尋與導航區 (地圖 + 列表) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

            <!-- 地圖區域 (欄位 7) -->
            <div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col h-[520px]">
                <div class="bg-slate-900 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                    <div class="flex items-center space-x-2 text-xs font-bold text-slate-300">
                        <i class="fa-solid fa-map-location-dot text-blue-400"></i>
                        <span>動態導航與淹水地圖</span>
                    </div>
                    <div class="flex items-center space-x-2 text-xs">
                        <!-- 淹水潛勢圖切換鈕 -->
                        <button id="btnToggleFloodMap" onclick="toggleFloodPotentialMap()" class="px-2.5 py-1 bg-cyan-950/80 text-cyan-300 hover:bg-cyan-900 border border-cyan-700/60 rounded-lg text-xs font-bold transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-layer-group"></i>
                            <span id="floodMapBtnText">顯示淹水潛勢圖</span>
                        </button>
                    </div>
                </div>

                <!-- 導航提示卡片（預設隱藏） -->
                <div id="routeInfoBox" class="hidden bg-emerald-950/80 border-b border-emerald-800/60 p-3 text-xs flex items-center justify-between backdrop-blur z-20">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm">
                            <i class="fa-solid fa-route"></i>
                        </div>
                        <div>
                            <div class="font-bold text-emerald-200" id="routeTitle">導航路線：黎明國小</div>
                            <div class="text-emerald-400 text-[11px]" id="routeDetail">距離約 600 公尺 | 步行約 7~8 分鐘</div>
                        </div>
                    </div>
                    <a id="btnGoogleMap" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg font-bold text-xs transition flex items-center space-x-1">
                        <span>🗺️ Google 導航</span>
                    </a>
                </div>

                <!-- 地圖 DOM 容器 -->
                <div id="map" class="w-full flex-1 bg-slate-950"></div>
            </div>

            <!-- 搜尋與列表區 (欄位 5) -->
            <div class="lg:col-span-5 flex flex-col space-y-4">

                <!-- 搜尋與篩選列 -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                    <div class="relative">
                        <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="搜尋淹水路段、避難所或颱風新聞..." 
                               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 pl-10 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                    </div>

                    <div class="flex items-center justify-between gap-2">
                        <div class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                            <button onclick="filterCategory('all')" id="catAll" class="px-2.5 py-1 rounded-lg font-medium text-white bg-slate-800">全部</button>
                            <button onclick="filterCategory('shelter')" id="catShelter" class="px-2.5 py-1 rounded-lg font-medium text-slate-400 hover:text-white">避難所</button>
                            <button onclick="filterCategory('flood')" id="catFlood" class="px-2.5 py-1 rounded-lg font-medium text-slate-400 hover:text-white">淹水資訊</button>
                            <button onclick="filterCategory('danger')" id="catDanger" class="px-2.5 py-1 rounded-lg font-medium text-amber-400 hover:text-amber-300">⚠️ 危險地帶</button>
                        </div>
                        <div class="flex items-center space-x-2">
                            <a href="https://www.cwa.gov.tw" target="_blank" rel="noopener noreferrer" title="開啟中央氣象署全球資訊網" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                <span>資訊來源</span>
                            </a>
                            <button onclick="triggerGeminiSearchRealtime()" class="px-3 py-1.5 bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 border border-blue-500/30 rounded-xl text-xs font-bold transition flex items-center space-x-1">
                                <i class="fa-solid fa-robot"></i>
                                <span>AI 即時搜尋</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 列表容器 -->
                <div id="dataList" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                    <!-- 動態載入項目 -->
                </div>
            </div>
        </div>
    </main>

    <!-- 頁腳 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 mt-auto">
        智慧颱風防汛與動態避難導航系統 &copy; 2026 | 中心定位點：宜蘭縣中華國中
    </footer>

    <!-- JavaScript 腳本 -->
    <script>
        // 1. 全域地理座標與控制變數
        const HOME_LAT = 24.7492;
        const HOME_LNG = 121.7675;

        let map = null;
        let markersGroup = null;
        let floodPotentialGroup = null; // 淹水潛勢圖層群組
        let showFloodMap = false;
        let routePolyline = null;
        let currentMode = 'realtime'; // 'realtime' 或 'ciampi'
        let currentCategory = 'all';
        let currentDataSet = [];

        // 2. 避難所與災情預設數據集
        const shelterList = [
            {
                id: 'shelter-1',
                title: '黎明國小體育館 (最近避難所)',
                category: 'shelter',
                lat: 24.7460,
                lng: 121.7710,
                address: '宜蘭縣宜蘭市校舍路1號',
                distance: 0.6,
                capacity: '1,200 人',
                phone: '(03) 938-1234',
                desc: '距離中華國中最近的官方推薦避難場所（步行約 7~8 分鐘），設施完善、備有急救醫療與物資儲備庫。'
            },
            {
                id: 'shelter-2',
                title: '宜蘭國中活動中心',
                category: 'shelter',
                lat: 24.7565,
                lng: 121.7580,
                address: '宜蘭縣宜蘭市樹人路37號',
                distance: 1.4,
                capacity: '950 人',
                phone: '(03) 932-2111',
                desc: '備用緊急避難所（步行約 14 分鐘），地勢較高，配有發電機與臨時收容區域。'
            },
            {
                id: 'shelter-3',
                title: '中山國小體育館',
                category: 'shelter',
                lat: 24.7530,
                lng: 121.7535,
                address: '宜蘭縣宜蘭市崇聖街2號',
                distance: 1.3,
                capacity: '1,100 人',
                phone: '(03) 932-2017',
                desc: '市區大型避難場所（步行約 15~16 分鐘），空間寬敞且具備完整水電與緊急收容物資。'
            }
        ];

        // 預防危險地帶數據
        const dangerZoneList = [
            {
                id: 'danger-1',
                title: '⚠️ 女中路地下道 (淹水極高危險區)',
                category: 'danger',
                lat: 24.7470,
                lng: 121.7640,
                status: '積水封閉高風險',
                desc: '短延時強降雨時地下道匯集大量地表逕流，極易造成車輛受困。颱風期間建議完全避開走地面陸橋。',
                sourceUrl: 'https://fhy.wra.gov.tw/fhyv2/'
            },
            {
                id: 'danger-2',
                title: '⚠️ 宜蘭河濱公園低窪河岸區',
                category: 'danger',
                lat: 24.7610,
                lng: 121.7580,
                status: '河水暴漲高風險',
                desc: '山區豪雨匯流致使宜蘭河水位急速暴漲，河濱步道與高灘地公園極易遭淹沒，請勿靠近觀浪或逗留。',
                sourceUrl: 'https://www.cwa.gov.tw'
            },
            {
                id: 'danger-3',
                title: '⚠️ 壯圍鄉低窪農田排水線周邊',
                category: 'danger',
                lat: 24.7330,
                lng: 121.7850,
                status: '排水倒灌警戒區',
                desc: '地勢較地平線低窪且臨近區域大排水溝，大潮遇強降雨時水流難以排出，道路視野差，行車危險。'
            }
        ];

        const realtimeData = [
            ...shelterList,
            ...dangerZoneList,
            {
                id: 'flood-1',
                title: '女中路一段低窪積水通報',
                category: 'flood',
                lat: 24.7450,
                lng: 121.7650,
                depth: '25 cm',
                status: '積水警戒中',
                desc: '連日豪雨導致低窪路段排水不及，建議行經車輛改道校舍路。'
            },
            {
                id: 'flood-2',
                title: '壯圍鄉中央路一段抽水站運作中',
                category: 'flood',
                lat: 24.7390,
                lng: 121.7820,
                depth: '15 cm',
                status: '抽水站連夜作業',
                desc: '移動式抽水機已佈設，周邊道路維持通暢但請注意安全。'
            }
        ];

        const ciampiData = [
            ...shelterList,
            ...dangerZoneList,
            {
                id: 'flood-ciampi-1',
                title: '【薔琵歷史模擬】女中路地下道嚴重淹水',
                category: 'flood',
                lat: 24.7450,
                lng: 121.7650,
                depth: '60 cm',
                status: '道路封閉警戒',
                desc: '薔琵颱風降雨量達每小時 80mm，女中路地下道積水嚴重，警方已設管制線。'
            },
            {
                id: 'flood-ciampi-2',
                title: '【薔琵歷史模擬】壯圍鄉低窪農田淹沒區',
                category: 'flood',
                lat: 24.7350,
                lng: 121.7880,
                depth: '45 cm',
                status: '區域淹水警戒',
                desc: '低窪地區受雨勢影響倒灌，居民已陸續撤離至黎明國小避難所。'
            }
        ];

        // 初始化預設數據集
        currentDataSet = [...realtimeData];

        // 3. 自訂 SVG Marker 圖示工廠
        function createSvgIcon(type, extraInfo = '') {
            let svgHtml = '';
            if (type === 'home') {
                svgHtml = `
                    <div style="background:#3b82f6; width:34px; height:34px; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.4);" class="rounded-full flex items-center justify-center text-white">
                        <i class="fa-solid fa-school text-sm"></i>
                    </div>`;
            } else if (type === 'shelter') {
                svgHtml = `
                    <div style="background:#10b981; width:32px; height:32px; border:2.5px solid white; box-shadow:0 4px 8px rgba(0,0,0,0.3);" class="rounded-full flex items-center justify-center text-white">
                        <i class="fa-solid fa-person-running text-sm"></i>
                    </div>`;
            } else if (type === 'danger') {
                // 預防危險地帶專用圖示
                svgHtml = `
                    <div style="background:#f59e0b; width:32px; height:32px; border:2.5px solid white; box-shadow:0 4px 8px rgba(245,158,11,0.5);" class="rounded-full flex items-center justify-center text-white animate-bounce">
                        <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                    </div>`;
            } else if (type === 'wind') {
                // 風速地圖專用動態標籤
                svgHtml = `
                    <div class="wind-marker-animated flex items-center bg-cyan-950/90 border-2 border-cyan-400 text-cyan-200 px-2.5 py-1 rounded-full shadow-lg text-xs font-bold whitespace-nowrap backdrop-blur">
                        <i class="fa-solid fa-wind mr-1.5 text-cyan-400"></i>
                        <span>${extraInfo || '風速監測'}</span>
                    </div>`;
                return L.divIcon({
                    html: svgHtml,
                    className: 'custom-leaflet-wind-icon',
                    iconSize: [120, 30],
                    iconAnchor: [60, 15]
                });
            } else { // flood
                svgHtml = `
                    <div style="background:#ef4444; width:32px; height:32px; border:2.5px solid white; box-shadow:0 4px 8px rgba(0,0,0,0.3);" class="rounded-full flex items-center justify-center text-white">
                        <i class="fa-solid fa-water text-sm"></i>
                    </div>`;
            }
            return L.divIcon({
                html: svgHtml,
                className: 'custom-leaflet-icon',
                iconSize: [34, 34],
                iconAnchor: [17, 17]
            });
        }

        // 4. 初始化地圖與地圖標示
        function initMap() {
            if (map) return;
            if (typeof L === 'undefined') {
                setTimeout(initMap, 200);
                return;
            }

            map = L.map('map', {
                center: [HOME_LAT, HOME_LNG],
                zoom: 14,
                zoomControl: true
            });

            // 採用 Esri 地圖圖層 (穩定、免 Key、無 403 阻擋)
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: '&copy; Esri, USGS',
                maxZoom: 18
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
            floodPotentialGroup = L.layerGroup().addTo(map);

            // 標示中華國中 (用戶位置)
            L.marker([HOME_LAT, HOME_LNG], { icon: createSvgIcon('home') })
             .addTo(map)
             .bindPopup(`
                <div class="p-1 text-slate-900">
                    <strong class="text-sm">宜蘭縣中華國中</strong><br>
                    <span class="text-xs text-slate-600">當前中心定位點</span>
                </div>
             `);

            renderDataSet();
        }

        // 5-1. 切換淹水潛勢圖層 (雨量豪雨模擬覆蓋層)
        function toggleFloodPotentialMap() {
            showFloodMap = !showFloodMap;
            const btn = document.getElementById('btnToggleFloodMap');
            const btnText = document.getElementById('floodMapBtnText');

            if (showFloodMap) {
                btn.className = "px-2.5 py-1 bg-cyan-500 text-slate-950 hover:bg-cyan-400 rounded-lg text-xs font-extrabold shadow-lg shadow-cyan-500/30 transition flex items-center space-x-1.5";
                btnText.innerText = "隱藏淹水潛勢圖";
                renderFloodPotentialOverlay();
            } else {
                btn.className = "px-2.5 py-1 bg-cyan-950/80 text-cyan-300 hover:bg-cyan-900 border border-cyan-700/60 rounded-lg text-xs font-bold transition flex items-center space-x-1.5";
                btnText.innerText = "顯示淹水潛勢圖";
                if (floodPotentialGroup) floodPotentialGroup.clearLayers();
            }
        }

        // 渲染淹水潛勢多邊形與強度圓圈
        function renderFloodPotentialOverlay() {
            if (!map || !floodPotentialGroup) return;
            floodPotentialGroup.clearLayers();

            // 1. 女中路一段與地下道周邊 (深層淹水高風險區: > 50cm - 紅色)
            L.circle([24.7455, 121.7650], {
                color: '#dc2626',
                fillColor: '#ef4444',
                fillOpacity: 0.45,
                radius: 280,
                weight: 2
            }).addTo(floodPotentialGroup).bindTooltip("淹水潛勢區：女中路地下道 (預估 >50cm)", { permanent: false, direction: 'top' });

            // 2. 壯圍鄉低窪平原與排水線 (中度淹水區: 20-50cm - 橘黃色)
            L.polygon([
                [24.7410, 121.7750],
                [24.7430, 121.7890],
                [24.7310, 121.7920],
                [24.7290, 121.7780]
            ], {
                color: '#ea580c',
                fillColor: '#f97316',
                fillOpacity: 0.35,
                weight: 2
            }).addTo(floodPotentialGroup).bindTooltip("淹水潛勢區：壯圍低窪農田與大排水線 (預估 20~50cm)", { permanent: false });

            // 3. 宜蘭河沿岸高灘地 (河川暴漲淹沒區 - 藍紫色)
            L.circle([24.7615, 121.7570], {
                color: '#7c3aed',
                fillColor: '#8b5cf6',
                fillOpacity: 0.4,
                radius: 320,
                weight: 2
            }).addTo(floodPotentialGroup).bindTooltip("淹水潛勢區：宜蘭河濱高灘地 (河水暴漲淹沒)", { permanent: false });
        }

        // 5. 渲染資料集到地圖標籤與清單
        function renderDataSet() {
            if (!map || !markersGroup) return;

            markersGroup.clearLayers();
            const listContainer = document.getElementById('dataList');
            listContainer.innerHTML = '';

            // 在地圖上直接標示風速動態標籤（中華國中上方視角）
            const windSpeedElem = document.getElementById('windSpeed');
            const windText = currentMode === 'realtime' 
                ? `即時風速: ${windSpeedElem ? windSpeedElem.innerText : '3.2'} m/s` 
                : `強風: 28m/s (陣風12級)`;

            const windMarker = L.marker([HOME_LAT + 0.003, HOME_LNG - 0.003], {
                icon: createSvgIcon('wind', windText)
            }).addTo(markersGroup);

            const gustSpeedElem = document.getElementById('gustSpeed');
            const gustLevelElem = document.getElementById('gustLevel');

            windMarker.bindPopup(`
                <div class="p-2 text-slate-900">
                    <strong class="text-xs text-cyan-700 block">🌬️ 地圖氣象觀測點</strong>
                    <div class="text-sm font-bold">${currentMode === 'realtime' ? '宜蘭市區即時風速觀測' : '薔琵颱風中心強風警戒'}</div>
                    <p class="text-xs text-slate-600 mt-1">陣風: ${gustSpeedElem ? gustSpeedElem.innerText : '5.5'} m/s (${gustLevelElem ? gustLevelElem.innerText : '3 級陣風'})</p>
                </div>
            `);

            const filteredData = currentDataSet.filter(item => {
                if (currentCategory === 'all') return true;
                return item.category === currentCategory;
            });

            filteredData.forEach(item => {
                // 地圖標示
                const marker = L.marker([item.lat, item.lng], {
                    icon: createSvgIcon(item.category)
                }).addTo(markersGroup);

                // 如果是危險區域，另外畫出警告範圍圈 (Circle)
                if (item.category === 'danger') {
                    L.circle([item.lat, item.lng], {
                        color: '#f59e0b',
                        fillColor: '#f59e0b',
                        fillOpacity: 0.2,
                        radius: 180
                    }).addTo(markersGroup);
                }

                marker.bindPopup(`
                    <div class="p-2 text-slate-900 max-w-[200px]">
                        <strong class="text-sm block mb-1">${item.title}</strong>
                        <p class="text-xs text-slate-600 mb-2">${item.desc}</p>
                        ${item.category === 'shelter' ? 
                          `<button onclick="drawRouteTo(${item.lat}, ${item.lng}, '${item.title}', ${item.distance})" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-bold shadow transition">📍 開啟路線導航</button>` : ''}
                        ${item.category === 'danger' ? `<div class="p-1 bg-amber-50 text-amber-800 rounded text-[11px] font-bold border border-amber-200">⚠️ 避難移動時請務必繞過此路段</div>` : ''}
                        ${item.sourceUrl ? `<a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer" class="mt-1.5 w-full py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-[11px] font-semibold flex items-center justify-center space-x-1 border border-slate-300 transition"><span>🔗 檢視官方資料來源</span></a>` : ''}
                    </div>
                `);

                // 列表項目 HTML
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-3.5 transition cursor-pointer flex flex-col space-y-2";
                card.onclick = () => {
                    map.flyTo([item.lat, item.lng], 15);
                    marker.openPopup();
                    if (item.category === 'shelter') {
                        drawRouteTo(item.lat, item.lng, item.title, item.distance);
                    }
                };

                const isShelter = item.category === 'shelter';
                const isDanger = item.category === 'danger';
                const sourceBtnHtml = item.sourceUrl 
                    ? `<a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-blue-400 border border-slate-700 rounded-lg text-[11px] font-medium transition flex items-center space-x-1"><i class="fa-solid fa-link text-[10px]"></i><span>檢視來源</span></a>` 
                    : '';

                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="p-2 rounded-lg text-xs ${isShelter ? 'bg-emerald-500/10 text-emerald-400' : isDanger ? 'bg-amber-500/10 text-amber-400' : 'bg-rose-500/10 text-rose-400'}">
                                <i class="fa-solid ${isShelter ? 'fa-house-medical' : isDanger ? 'fa-triangle-exclamation' : 'fa-water'}"></i>
                            </span>
                            <div>
                                <h3 class="text-xs font-bold text-white">${item.title}</h3>
                                <p class="text-[11px] text-slate-400">${isShelter ? item.address : isDanger ? '危險類型: 低窪淹水/地下道受困' : '積水深度: ' + (item.depth || '監測中')}</p>
                            </div>
                        </div>
                        ${isShelter ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">約 ${item.distance} km</span>` : isDanger ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30">高風險避開</span>` : `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30">${item.status || '警戒中'}</span>`}
                    </div>
                    <p class="text-xs text-slate-400 leading-relaxed">${item.desc}</p>
                    ${sourceBtnHtml ? `<div class="flex justify-end pt-1">${sourceBtnHtml}</div>` : ''}
                `;
                listContainer.appendChild(card);
            });
        }

        // 6. 避難所真實道路導航路徑繪製 (使用 OSRM 道路 API)
        async function drawRouteTo(destLat, destLng, title, defaultDistance) {
            if (!map) return;

            // 移除舊路線（防重複）
            if (routePolyline) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }

            const routeBox = document.getElementById('routeInfoBox');
            const routeTitle = document.getElementById('routeTitle');
            const routeDetail = document.getElementById('routeDetail');
            const btnGoogleMap = document.getElementById('btnGoogleMap');

            routeBox.classList.remove('hidden');
            routeTitle.innerText = `規劃路線中：${title}...`;
            routeDetail.innerText = `正在透過道路網絡計算真實行走路線...`;

            try {
                // 呼叫 OSRM 官方免費步行道路 API
                const url = `https://router.project-osrm.org/route/v1/foot/${HOME_LNG},${HOME_LAT};${destLng},${destLat}?overview=full&geometries=geojson`;
                const response = await fetch(url, { cache: 'force-cache' });
                const data = await response.json();

                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    // 解析道路座標點陣列 [lat, lng]
                    const routeCoords = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);

                    // 繪製順著真實道路的藍色連線
                    routePolyline = L.polyline(routeCoords, {
                        color: '#3b82f6',
                        weight: 6,
                        opacity: 0.95,
                        className: 'route-path-animated'
                    }).addTo(map);

                    // 調整鏡頭聚焦整條道路路線
                    map.fitBounds(routePolyline.getBounds(), { padding: [60, 60] });

                    // 計算道路真實行走距離 (km) 與預估步行分鐘
                    const realDistKm = (route.distance / 1000).toFixed(2);
                    const walkMinutes = Math.max(1, Math.round(route.duration / 60));

                    routeTitle.innerText = `避難道路指引：${title}`;
                    routeDetail.innerText = `沿街實測距離：${realDistKm} km | 預估步行時間：約 ${walkMinutes} 分鐘 (順著街道指示指引)`;
                } else {
                    throw new Error("無法取得道路數據");
                }
            } catch (err) {
                console.warn("OSRM 道路服務回應超時或異常，改為備用實體轉向連線", err);
                
                // 備用方案：若 API 網路延遲，使用轉折連線
                const latLngs = [
                    [HOME_LAT, HOME_LNG],
                    [HOME_LAT, destLng],
                    [destLat, destLng]
                ];
                routePolyline = L.polyline(latLngs, {
                    color: '#3b82f6',
                    weight: 6,
                    opacity: 0.95,
                    className: 'route-path-animated'
                }).addTo(map);

                map.fitBounds(routePolyline.getBounds(), { padding: [60, 60] });

                routeTitle.innerText = `避難道路指引：${title}`;
                const timeEst = Math.round((defaultDistance || 0.6) * 12);
                routeDetail.innerText = `距離約 ${defaultDistance || 0.6} km | 預估步行時間：${timeEst} 分鐘 (沿主要幹道行走)`;
            }

            // Google 地圖實體導航連結
            btnGoogleMap.href = `https://www.google.com/maps/dir/?api=1&origin=${HOME_LAT},${HOME_LNG}&destination=${destLat},${destLng}&travelmode=walking`;
        }

        // 7. 找出最近避難所 (黎明國小)
        function findNearestShelter() {
            const nearest = currentDataSet.find(d => d.id === 'shelter-1') || currentDataSet[0];
            if (nearest && map) {
                map.flyTo([nearest.lat, nearest.lng], 15);
                drawRouteTo(nearest.lat, nearest.lng, nearest.title, nearest.distance);
            }
        }

        // 8. 模式切換邏輯 (現實即時 vs 薔琵模擬)
        function switchMode(mode) {
            currentMode = mode;
            const btnRealtime = document.getElementById('btnRealtimeMode');
            const btnCiampi = document.getElementById('btnCiampiMode');

            const badge = document.getElementById('currentModeBadge');
            const title = document.getElementById('currentModeTitle');
            const desc = document.getElementById('currentModeDesc');

            const windSpeed = document.getElementById('windSpeed');
            const windSpeedKm = document.getElementById('windSpeedKm');
            const gustSpeed = document.getElementById('gustSpeed');
            const gustLevel = document.getElementById('gustLevel');

            const warningTitle = document.getElementById('warningTitle');
            const warningDesc = document.getElementById('warningDesc');

            // 移除舊路線與導航卡
            if (routePolyline && map) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }
            document.getElementById('routeInfoBox').classList.add('hidden');

            if (mode === 'realtime') {
                btnRealtime.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 bg-blue-600 text-white shadow";
                btnCiampi.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center space-x-1.5";
                
                badge.className = "inline-block px-2.5 py-1 rounded-full text-xs font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30 mb-2";
                badge.innerHTML = `<i class="fa-solid fa-circle-dot text-[10px] mr-1"></i> 現實即時模式`;
                title.innerText = "現實全網即時氣象與災情動態";
                desc.innerText = "自動透過 AI 聯網搜尋當前宜蘭與全台真實颱風、豪雨特報與積水狀況。";

                windSpeed.innerText = "3.2";
                windSpeedKm.innerText = "約 11.5 km/h";
                gustSpeed.innerText = "5.5";
                gustLevel.innerText = "3 級陣風 (微風)";
                warningTitle.innerText = "風勢平穩警戒解除";
                warningDesc.innerText = "微風狀態，請隨時留意最新氣象發佈與降雨預報。";

                currentDataSet = [...realtimeData];
                renderDataSet();
                if (map) map.flyTo([HOME_LAT, HOME_LNG], 14);
            } else {
                btnCiampi.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 bg-amber-600 text-white shadow";
                btnRealtime.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center space-x-1.5";

                badge.className = "inline-block px-2.5 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30 mb-2";
                badge.innerHTML = `<i class="fa-solid fa-history text-[10px] mr-1"></i> 薔琵颱風歷史模擬`;
                title.innerText = "薔琵颱風豪雨情境模擬";
                desc.innerText = "載入薔琵颱風強陣風數據與宜蘭低窪區歷史淹水模擬。";

                windSpeed.innerText = "28";
                windSpeedKm.innerText = "約 100.8 km/h";
                gustSpeed.innerText = "36.8";
                gustLevel.innerText = "12 級陣風 (暴風極限)";
                warningTitle.innerText = "強烈暴風與淹水雙重警戒";
                warningDesc.innerText = "強風易造成樹木倒塌與招牌掉落，低窪路段已出現嚴重積淹水。";

                currentDataSet = [...ciampiData];
                renderDataSet();
                if (map) map.flyTo([24.7430, 121.7680], 15);
            }
        }

        // 9. 關鍵字搜尋與分類過濾
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const listContainer = document.getElementById('dataList');
            const cards = listContainer.children;

            for (let card of cards) {
                const text = card.innerText.toLowerCase();
                if (text.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            const btnAll = document.getElementById('catAll');
            const btnShelter = document.getElementById('catShelter');
            const btnFlood = document.getElementById('catFlood');
            const btnDanger = document.getElementById('catDanger');

            btnAll.className = cat === 'all' ? "px-2.5 py-1 rounded-lg font-medium text-white bg-slate-800" : "px-2.5 py-1 rounded-lg font-medium text-slate-400 hover:text-white";
            btnShelter.className = cat === 'shelter' ? "px-2.5 py-1 rounded-lg font-medium text-white bg-slate-800" : "px-2.5 py-1 rounded-lg font-medium text-slate-400 hover:text-white";
            btnFlood.className = cat === 'flood' ? "px-2.5 py-1 rounded-lg font-medium text-white bg-slate-800" : "px-2.5 py-1 rounded-lg font-medium text-slate-400 hover:text-white";
            btnDanger.className = cat === 'danger' ? "px-2.5 py-1 rounded-lg font-medium text-amber-300 bg-amber-950/60 border border-amber-700/50" : "px-2.5 py-1 rounded-lg font-medium text-amber-400 hover:text-amber-300";

            renderDataSet();
        }

        // 10. 現實模式下的真實全網搜尋與數據更新
        async function triggerGeminiSearchRealtime() {
            const listContainer = document.getElementById('dataList');
            const loadingCard = document.createElement('div');
            loadingCard.className = "bg-blue-950/40 border border-blue-800/50 p-4 rounded-xl text-xs text-blue-300 animate-pulse flex items-center space-x-2";
            loadingCard.innerHTML = `<i class="fa-solid fa-cloud-bolt fa-spin"></i><span>正在檢索宜蘭即時氣象與防災通報...</span>`;
            listContainer.prepend(loadingCard);

            setTimeout(() => {
                loadingCard.remove();
                
                // 動態在現實模式加入即時監測點
                const liveFloodPoints = [
                    {
                        id: 'live-flood-1',
                        title: '【即時連線】女中路地下道/周邊積水監測',
                        category: 'flood',
                        lat: 24.7455,
                        lng: 121.7655,
                        depth: '即時監測中',
                        status: '即時通報',
                        desc: '透過氣象與新聞即時彙整：該區域逢豪雨易積水，目前維持警戒。',
                        sourceUrl: 'https://fhy.wra.gov.tw/fhyv2/'
                    },
                    {
                        id: 'live-flood-2',
                        title: '【即時連線】宜蘭河濱公園低窪水域',
                        category: 'flood',
                        lat: 24.7620,
                        lng: 121.7560,
                        depth: '即時監測中',
                        status: '水位警戒',
                        desc: '河川水位監測點，提醒民眾勿靠近河岸。',
                        sourceUrl: 'https://www.cwa.gov.tw/V8/C/'
                    }
                ];

                liveFloodPoints.forEach(pt => {
                    if (!currentDataSet.some(d => d.id === pt.id)) {
                        currentDataSet.push(pt);
                    }
                });

                renderDataSet();
            }, 1000);
        }

        // 頁面載入後自動啟動地圖
        window.onload = function() {
            initMap();
        };
    </script>
